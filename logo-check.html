<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOCAB CLASH | App &amp; icon check</title><link rel="icon" href="./icons/vocab-tab-r2.ico"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1420;color:#eef5fc;font:16px/1.65 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}h1{line-height:1.25}p{color:#b5c6d7}a{color:#83e7df}button{background:#83e7df;color:#0d1420;border:0;padding:12px 22px;font:600 16px system-ui;border-radius:10px;min-height:44px;cursor:pointer}button:disabled{opacity:.6}button:focus-visible,a:focus-visible{outline:3px solid #efca85;outline-offset:4px}.icons{display:flex;flex-wrap:wrap;gap:24px;align-items:end;padding:20px;background:#151f2e;border-radius:14px}figure{margin:0;text-align:center}figure img{display:block;margin:auto}figcaption{font-size:12px;color:#b5c6d7;margin-top:6px}.row{padding:10px 0;border-bottom:1px solid #344356;overflow-wrap:anywhere}.ok{color:#98dab9}.bad{color:#ff9fab}small{color:#b5c6d7}#results{margin-top:20px}code{overflow-wrap:anywhere}
body{background:radial-gradient(ellipse at top left,#0c3250,#060b20 60%);color:#f3f8ff}button{background:linear-gradient(#8ceeff,#31afea);color:#06263e;border:1px solid #a7eeff;box-shadow:0 3px 0 #124a7c}.icons{background:linear-gradient(140deg,#152a48,#0d1932);border:1px solid #42668c}a{color:#8beaff}</style></head><body><main><a href="./">返回遊戲</a><h1>圖示檢查</h1><p>確認網頁、手機圖示與 manifest 已正確上傳。不會存取你的學習資料。</p><div class="icons"><figure><img src="./icons/vocab-tab-r2-16.png" width="16" height="16" alt="16px favicon"><figcaption>16px</figcaption></figure><figure><img src="./icons/vocab-tab-r2-32.png" width="32" height="32" alt="32px favicon"><figcaption>32px</figcaption></figure><figure><img src="./icons/vocab-tab-r2-48.png" width="48" height="48" alt="48px favicon"><figcaption>48px</figcaption></figure><figure><img src="./icons/vocab-app-r2-180.png" width="120" height="120" alt="Home screen icon"><figcaption>Home screen</figcaption></figure></div><p><strong>檢查完成後，請先按「返回遊戲」，再將遊戲加入主畫面。</strong></p><p><button id="check" type="button">開始檢查</button></p><div id="results" role="status" aria-live="polite"></div><p><small>這是資源檢查，不是手機安裝或快取更新的保證。</small></p></main><script>
'use strict';
const out=document.querySelector('#results'),button=document.querySelector('#check');
function row(label,ok,detail=''){const e=document.createElement('div');e.className='row '+(ok?'ok':'bad');e.textContent=(ok?'PASS  ':'FAIL  ')+label+(detail?' - '+detail:'');out.append(e);return ok;}
async function load(url,kind){const response=await fetch(url,{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw Error('HTTP '+response.status);if(kind==='json')return response.json();if(kind==='blob')return response.blob();return response.text();}
async function imageCheck(url,expected){const blob=await load(url,'blob'),local=URL.createObjectURL(blob);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Image decode failed'));img.src=local;});if(expected&&`${img.naturalWidth}x${img.naturalHeight}`!==expected)throw Error('Wrong dimensions');return `${img.naturalWidth}x${img.naturalHeight}`;}finally{URL.revokeObjectURL(local);}}
button.addEventListener('click',async()=>{button.disabled=true;out.replaceChildren();let passed=0,total=0;async function check(label,task){total++;try{const detail=await task();row(label,true,detail||'');passed++;}catch(e){row(label,false,e.message);}}
try{if(!['https:','http:'].includes(location.protocol))throw Error('Open the published HTTPS website before checking.');
const base=new URL('./',location.href),home=new URL('index.html',base),text=await load(home),doc=new DOMParser().parseFromString(text,'text/html');
await check('Homepage release',async()=>{if(!text.includes('vc-app-r2')||doc.querySelector('meta[name="vocab-app-release"]')?.content!=='vc-app-r2')throw Error('Old index.html');return 'vc-app-r2';});
await check('Apple standalone declarations',async()=>{if(doc.querySelector('meta[name="apple-mobile-web-app-capable"]')?.content!=='yes'||doc.querySelector('meta[name="mobile-web-app-capable"]')?.content!=='yes')throw Error('Missing standalone declaration');return 'yes';});
await check('Lobby name / no large logo',async()=>{if(doc.querySelector('#lobbyName')?.textContent!=='VOCABCLASH'||doc.querySelector('#viewLobby .vd-intro img'))throw Error('Unexpected lobby branding');return 'VOCABCLASH';});
await check('Safe area support',async()=>{if(!doc.querySelector('meta[name="viewport"]')?.content.includes('viewport-fit=cover'))throw Error('Viewport not updated');return 'viewport-fit=cover';});
const icons=[...doc.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]')];
for(const el of icons){await check(el.getAttribute('href'),async()=>{const u=new URL(el.getAttribute('href'),home);if(u.origin!==location.origin||!u.pathname.startsWith(base.pathname))throw Error('Path outside this game folder');if(u.pathname.endsWith('.ico')){const b=await load(u,'blob');const a=new Uint8Array(await b.arrayBuffer());if(a[0]||a[1]||a[2]!==1||a[3])throw Error('Invalid ICO header');return `${b.size} bytes`;}return imageCheck(u,el.getAttribute('sizes'));});}
const link=doc.querySelector('link[rel="manifest"]');if(!link)throw Error('Missing manifest link');const mu=new URL(link.getAttribute('href'),home),m=await load(mu,'json');
await check('Manifest / launch path',async()=>{if(m.name!=='VOCAB CLASH'||m.display!=='standalone')throw Error('Unexpected manifest');if(new URL(m.start_url,mu).href!==base.href||new URL(m.scope,mu).href!==base.href||new URL(m.id,mu).href!==base.href)throw Error('Launch path points outside the game');return m.name;});
for(const icon of m.icons||[])await check(icon.src+' ['+icon.purpose+']',()=>imageCheck(new URL(icon.src,mu),icon.sizes));
await check('192px + 512px + maskable',async()=>{if(!m.icons.some(i=>i.sizes==='192x192'&&i.purpose==='any')||!m.icons.some(i=>i.sizes==='512x512'&&i.purpose==='any')||!m.icons.some(i=>i.purpose==='maskable'))throw Error('Incomplete icon set');});
for(const name of ['favicon.ico','apple-touch-icon.png'])await check(name,async()=>{await load(new URL(name,base),'blob');});
row(`${passed} / ${total}`,passed===total);
}catch(e){row('Check',false,e.message);}finally{button.disabled=false;}});
</script></body></html>
